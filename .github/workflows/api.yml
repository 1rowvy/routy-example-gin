name: API

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      # In a real project both come from `secrets.ADMIN_PASSWORD`.
      ADMIN_PASSWORD: admin # the service
      OUTRY_ADMIN_PASSWORD: admin # the `admin_password` secret in api/env.toml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Outry
        run: |
          curl -fsSL https://raw.githubusercontent.com/1rowvy/outry/master/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Syntax, names, every environment, formatting — and every request against the
      # Go routes. A drift shows up as an annotation on the changed line in the PR.
      - name: Requests match the code
        run: outry check --format github

      - name: Run every request and flow
        run: |
          go build -o shop .
          GIN_MODE=release ./shop &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://localhost:8080/health
          outry run api --yes
