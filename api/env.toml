# Routy project: environments and variables for every request in api/.
# Secret values never go here — see `secrets` below.
project = "shop"
default = "dev"

# Kept in the system keychain locally (`routy secret set admin_password`)
# and in ROUTY_ADMIN_PASSWORD in CI.
secrets = ["admin_password"]

[vars]
admin_email = "admin@shop.test"

[env.dev]
base = "http://localhost:8080"

[env.staging]
base = "https://staging.shop.example"

# Routes behind these Go middlewares get the headers when `routy import go`
# creates their requests, and `routy check` warns when a request lacks them.
[import.middleware]
AuthRequired = { headers = { Authorization = "Bearer ${Login().body.token}" } }
